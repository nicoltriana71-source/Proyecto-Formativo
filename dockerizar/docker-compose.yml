services:
  # Aplicación FastAPI + StudNova IA
  web:
    build:
      context: ..
      dockerfile: dockerizar/Dockerfile
    container_name: studnova_app
    restart: always
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://postgres:1234@host.docker.internal:5432/studnova
    env_file:
      - ../.env
    volumes:
      - ../ia:/app/ia
      - ../principal:/app/principal
