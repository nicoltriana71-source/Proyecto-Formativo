<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudNova — Iniciar sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container">

        <div class="form-container active" id="login">
            <img src="image.png" alt="Logo" width="50" height="50" class="logo">
            <br>
            <h2>StudNova</h2>
            <p id="loginMensaje" class="form-mensaje"></p>

            <form id="formLogin">
                <input type="email" id="loginCorreo" placeholder="Correo electrónico" required>
                <input type="password" id="loginPassword" placeholder="Contraseña" required maxlength="10">
                <button type="submit">Entrar</button>

                <button type="button" id="btnGoogle" class="google-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                Continuar con Google
                </button>
            </form>


            <div class="links">
                <a href="#" onclick="mostrarFormulario('register'); return false;">Registrarme</a>
            </div>
        </div>

        <div class="form-container" id="register">
            <h2>Registrarme</h2>
            <p id="registerMensaje" class="form-mensaje error" hidden></p>

            <form id="formRegister">
                <input type="text" id="registerNombre" placeholder="Nombre completo" required>
                <input type="email" id="registerCorreo" placeholder="Correo electrónico" required>
                <input type="password" id="registerPassword" placeholder="Contraseña (máx. 10)" required maxlength="10">
                <button type="submit">Crear cuenta</button>
            </form>

            <div class="links">
                <a href="#" onclick="mostrarFormulario('login'); return false;">Ya tengo cuenta</a>
            </div>
        </div>

    </div>

    <script src="js/studnova-session.js"></script>
    <script src="ia/api.js"></script>
    <script>
        function mostrarFormulario(id) {
            document.querySelectorAll('.form-container')
                .forEach(form => form.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function guardarSesionYRedirigir(data) {
            StudNovaSession.save({
                token: data.access_token,
                id_usuario: data.id_usuario,
                rol: data.rol,
                nombre: data.nombre,
                correo: data.correo,
            });

            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'ia/interfaz.html';
            window.location.href = redirect;
        }

        if (StudNovaSession.isAuthenticated()) {
            const params = new URLSearchParams(window.location.search);
            window.location.href = params.get('redirect') || 'ia/interfaz.html';
        }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('loginMensaje');
            mensaje.textContent = 'Iniciando sesión...';
            mensaje.className = 'form-mensaje';

            try {
                const data = await StudNovaAPI.login(
                    document.getElementById('loginCorreo').value.trim(),
                    document.getElementById('loginPassword').value
                );
                guardarSesionYRedirigir(data);
            } catch (error) {
                mensaje.textContent = error.message;
                mensaje.className = 'form-mensaje error';
            }
        });

        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('registerMensaje');
            mensaje.hidden = false;
            mensaje.textContent = 'Creando cuenta...';
            mensaje.className = 'form-mensaje';

            try {
                const data = await StudNovaAPI.registro(
                    document.getElementById('registerNombre').value.trim(),
                    document.getElementById('registerCorreo').value.trim(),
                    document.getElementById('registerPassword').value
                );
                guardarSesionYRedirigir(data);
            } catch (error) {
                mensaje.textContent = error.message;
                mensaje.className = 'form-mensaje error';
            }
        });
    </script>

    <script src="js/login.js"></script>
    <script src="js/google-callback.js"></script>
</body>
</html>
