<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudNova IA - Chat</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>

    <div class="contenedor">
        
        <!-- Header con botón Cerrar Sesión -->
        <div class="header">
            <button type="button" class="cerrar-sesion" onclick="cerrarSesion()">Cerrar Sesión</button>
            <h1>StudNova IA</h1>
            <p>Tu asistente inteligente para generar planes de estudio interactivos</p>
        </div>

        <!-- Área de Chat -->
        <div class="chat" id="chat-box">
            
            <!-- Mensaje inicial de bienvenida de la IA -->
            <div class="mensaje">
                <div class="avatar">
                    <img src="/login/image.png" alt="Logo" width="50" height="50" class="logo" style="border-radius:50%; object-fit:cover;">
                </div>
                <div class="contenido">
                    <p>¡Hola! 👋 Soy tu asistente de <strong>StudNova IA</strong>.</p>
                    <p style="margin-top: 8px;">Cuéntame, ¿qué materia o tema te gustaría aprender hoy?</p>
                </div>
            </div>

        </div>

        <!-- Barra inferior para escribir -->
        <div class="escribir">
            <textarea 
                id="prompt-input" 
                rows="2" 
                placeholder="Escribe tu mensaje aquí..." 
                onkeydown="manejarEnter(event)"
            ></textarea>
            <button id="btn-enviar" onclick="enviarMensaje()">Enviar</button>
        </div>

    </div>

    <!-- Script del Chat y Lógica de StudNova IA -->
    <script src="renderizador.js"></script>
</body>
</html>
