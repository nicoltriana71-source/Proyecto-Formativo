<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudNova IA - Chat</title>
    <link rel="stylesheet" href="/ia/css.css">
</head>
<body>

    <div class="contenedor">
        
        <!-- Header -->
        <div class="header">
            <h1>StudNova IA</h1>
            <p>Tu asistente inteligente para generar planes de estudio interactivos</p>
        </div>

        <!-- Área de Chat -->
        <div class="chat" id="chat-box">
            
            <!-- Mensaje inicial de bienvenida de la IA -->
            <div class="mensaje">
                <div class="avatar">🤖</div>
                <div class="contenido">
                    <p>¡Hola! 👋 Soy tu asistente de <strong>StudNova IA</strong>.</p>
                    <p style="margin-top: 8px;">Cuéntame, ¿qué materia o tema te gustaría aprender hoy?</p>
                </div>
            </div>

        </div>

        <!-- Barra inferior para escribir -->
        <div class="escribir">
            <textarea 
                id="prompt-input" 
                rows="2" 
                placeholder="Escribe tu mensaje aquí..." 
                onkeydown="manejarEnter(event)"
            ></textarea>
            <button id="btn-enviar" onclick="enviarMensaje()">Enviar</button>
        </div>

    </div>

    <!-- Lógica del Chat Inteligente -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const promptInput = document.getElementById('prompt-input');
        const btnEnviar = document.getElementById('btn-enviar');

        // Memoria de la conversación
        let historialConversacion = [];

        function manejarEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensaje();
            }
        }

        async function enviarMensaje() {
            const texto = promptInput.value.trim();
            if (!texto) return;

            // 1. Agregar mensaje del usuario
            agregarMensajeUsuario(texto);
            historialConversacion.push({ rol: "usuario", texto: texto });

            promptInput.value = '';
            btnEnviar.disabled = true;
            btnEnviar.style.opacity = '0.5';

            // 2. Indicador de carga
            const idCarga = agregarMensajeCarga();
            scrollAlFondo();

            try {
                // 3. Llamada al endpoint de FastAPI enviando el historial
                const respuesta = await fetch('/api/ia/generar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: texto,
                        historial: historialConversacion 
                    })
                });

                let datos;
                const textoRespuesta = await respuesta.text();
                try {
                    datos = JSON.parse(textoRespuesta);
                } catch {
                    throw new Error(textoRespuesta || 'Error en la respuesta del servidor');
                }

                if (!respuesta.ok) {
                    throw new Error(datos.detail || 'Ocurrió un error al procesar');
                }

                // Guardar la respuesta de la IA en el historial
                const textoIA = datos.mensaje || "He procesado tu respuesta.";
                historialConversacion.push({ rol: "ia", texto: textoIA });

                // 4. Quitar carga y mostrar respuesta adecuada
                removerElemento(idCarga);
                agregarMensajeIA(datos);

            } catch (error) {
                removerElemento(idCarga);
                agregarMensajeError(error.message);
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.style.opacity = '1';
                promptInput.focus();
                scrollAlFondo();
            }
        }

        function agregarMensajeUsuario(texto) {
            const div = document.createElement('div');
            div.className = 'mensaje';
            div.style.flexDirection = 'row-reverse';
            div.innerHTML = `
                <div class="avatar" style="background:#475569;">👤</div>
                <div class="contenido" style="background:#2563eb;">
                    <p>${escaparHTML(texto)}</p>
                </div>
            `;
            chatBox.appendChild(div);
        }

        function agregarMensajeCarga() {
            const id = 'carga-' + Date.now();
            const div = document.createElement('div');
            div.className = 'mensaje';
            div.id = id;
            div.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="contenido">
                    <p>⏳ <em>StudNova IA está respondiendo...</em></p>
                </div>
            `;
            chatBox.appendChild(div);
            return id;
        }

        // FUNCIÓN QUE DECIDE SI MOSTRAR SOLO TEXTO O MOSTRAR EL PLAN COMPLETO
        function agregarMensajeIA(datos) {
            const div = document.createElement('div');
            div.className = 'mensaje';

            // Detectar si la respuesta trae un plan generado completo con módulos
            const tienePlan = (datos.tipo === "plan_generado") || (datos.plan && datos.plan.modulos && datos.plan.modulos.length > 0) || (datos.modulos && datos.modulos.length > 0);

            if (!tienePlan) {
                // 🟢 CASO 1: CONVERSACIÓN NORMAL (Solo texto y preguntas pedagógicas)
                const mensajeTexto = datos.mensaje || (typeof datos === 'string' ? datos : "Cuéntame más sobre lo que quieres aprender.");
                div.innerHTML = `
                    <div class="avatar">🤖</div>
                    <div class="contenido">
                        <p>${escaparHTML(mensajeTexto)}</p>
                    </div>
                `;
            } else {
                // 🟢 CASO 2: PLAN TERMINADO (Muestra mensaje + visor interactivo con iframe)
                const planObjeto = datos.plan || datos;
                localStorage.setItem("plan_estudio_actual", JSON.stringify(planObjeto));

                const mensajeTexto = datos.mensaje || "✨ ¡Plan de estudio generado con éxito!";

                div.innerHTML = `
                    <div class="avatar">🤖</div>
                    <div class="contenido" style="width: 85%;">
                        <p><strong>${escaparHTML(mensajeTexto)}</strong></p>
                        <p style="margin-top: 5px; font-size: 14px; opacity: 0.9;">
                            He estructurado tu ruta de aprendizaje a tu medida con quizzes y control de fatiga.
                        </p>

                        <!-- Botón para ver en pantalla completa -->
                        <div style="margin: 12px 0;">
                            <a href="/principal/interfaz plan de estudio/visor_plan.html" target="_blank" style="display:inline-block; padding: 8px 16px; background:#2563eb; color:white; text-decoration:none; border-radius:8px; font-weight:bold; font-size:14px;">
                                ↗️ Abrir Plan en Pantalla Completa
                            </a>
                        </div>

                        <!-- Previsualización interactiva con el plan completo -->
                        <div style="border-radius: 10px; overflow: hidden; border: 1px solid #334155; margin-top: 10px;">
                            <iframe src="/principal/interfaz plan de estudio/visor_plan.html" style="width: 100%; height: 500px; border: none; background: #0f172a;"></iframe>
                        </div>
                    </div>
                `;
            }

            chatBox.appendChild(div);
        }

        function agregarMensajeError(mensaje) {
            const div = document.createElement('div');
            div.className = 'mensaje';
            div.innerHTML = `
                <div class="avatar" style="background:#dc2626;">⚠️</div>
                <div class="contenido" style="background:#7f1d1d;">
                    <p><strong>Error:</strong> ${escaparHTML(mensaje)}</p>
                </div>
            `;
            chatBox.appendChild(div);
        }

        function removerElemento(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollAlFondo() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escaparHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
