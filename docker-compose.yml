services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: studnova_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: studnova
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studnova"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicación FastAPI + Interfaces Web (StudNova)
  web:
    build: .
    container_name: studnova_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/studnova
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ia:/app/ia
      - ./principal:/app/principal

volumes:
  postgres_data:
